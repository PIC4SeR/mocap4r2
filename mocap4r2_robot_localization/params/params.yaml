/**:
  mocap4r2_robot_localization:
    ros__parameters:
      root_frame: 'mocap'
      map_frame: 'map'
      odom_frame: 'odom'
      robot_frame: 'base_link'
      mocap_frame: 'base_mocap_link'
      rigid_body_name: 'Jackal.Jackal'
      rigid_body_topic: '/rigid_bodies'
      odometry_topic: '/vicon/odom'
      init_root2map_xyzrpy: [2.2078, 1.791, 0.0, 0.0, 0.0, 0.0] # for the covivio-v1 map
      covariance:
        pose: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
        twist: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
      # Velocity estimation: 'ema' (finite difference + exponential moving
      # average, smoothed by alpha) or 'kalman' (constant-velocity Kalman filter
      # on the map-frame position + yaw, tuned by the kalman_* gains below).
      velocity_filter: 'ema'
      # alpha: 0.1 # for exponential moving average
      kalman_process_noise: 1.0        # accel spectral density; larger = more responsive
      kalman_measurement_noise: 0.01    # smoothing knob (larger = smoother); 0.01-0.05 validated on prova_vicon
      kalman_gate: 25.0                # chi-square gate on (x,y) innovation; 0 disables. 25 (2-DOF) rejects gross swaps/teleports, validated on prova_vicon
      kalman_max_coast: 10             # force track re-acquire after this many consecutive gated samples
